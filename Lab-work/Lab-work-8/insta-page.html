
<!DOCTYPE html>
<html>
<head>
  <title>Reel Table Layout</title>
  <link rel="stylesheet" href="insta-page.css">

</head>
<body>

  
  <table class="reel-table">
  
    <tr height="320">
      <td colspan="2"></td>
    </tr>

    
    <tr class="bottom-row">
  
      <td width="210" align="left">
        <div>
          <span class="profile-pic"></span>
          <span class="username">bca_coder</span>
        </div>
        <p class="caption">Reel layout made using HTML table tag 📊 #html #bca</p>
      </td>

      
      <td width="70" align="center">
        <div class="btn">❤️</div>
        <div class="count">1.5k</div>

        <div class="btn">💬</div>
        <div class="count">84</div>

        <div class="btn">✈️</div>
        <div class="count">Share</div>
      </td>
    </tr>
  </table>

</body>
</html>
